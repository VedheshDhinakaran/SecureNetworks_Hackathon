# Victim Samba server: deliberately weak (admin-style share, no host restriction, signing not required).
[global]
   workgroup = WORKGROUP
   server min protocol = SMB2
   server signing = auto
   map to guest = never
   log file = /var/log/samba/log.%m

[files]
   path = /srv/files
   read only = no
   valid users = deploy

[C$]
   path = /srv/c_drive
   read only = no
   valid users = deploy
   browseable = no
