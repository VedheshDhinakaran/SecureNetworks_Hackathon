# Tripwire detection catalog: the single source of truth (detection-as-code).
# Suricata rules, Zeek thresholds, Navigator layer, enrichment, RCA mapping and
# the detection-logic document are ALL generated from this file.
# Edit thresholds here, then run:  python -m tripwire build-rules

meta:
  project: Tripwire
  # MITRE IDs below come from the hackathon brief. Confirm them against the
  # current ATT&CK release and record the version here before you submit.
  attack_version: "CONFIRM-BEFORE-SUBMIT"
  home_net: "10.0.0.0/24"
  victim_ip: "10.0.0.10"
  mgmt_subnet: "10.0.3.0/24"       # the only subnet allowed to administer the victim

mitigations:
  M1030: Network Segmentation
  M1031: Network Intrusion Prevention
  M1035: Limit Access to Resource Over Network
  M1036: Account Use Policies
  M1037: Filter Network Traffic
  M1042: Disable or Remove Feature or Program
  M1050: Exploit Protection
  M1054: Software Configuration

# Layers: L1 = Suricata, short window, fast signature/threshold.
#         L2 = Zeek (and native), long window, catches slow/low attacks.
classes:
  web_fuzz:
    title: Web wordlist fuzzing
    technique: T1595.003
    technique_name: "Wordlist Scanning"
    tactic: Reconnaissance
    tactic_id: TA0043
    order: 1                         # kill-chain order used by correlation
    severity: 3
    l1: {count: 150, window: 10}     # 403/404 replies per client in 10 s (a RATE rule: only a loud flood; cannot count paths)
    l2: {count: 25, window: 300, errors: 50, ratio: 0.5}   # contextual: >=50 errors AND >=25 distinct failing paths AND error ratio >=0.5, sliding 5 min per source-destination service
    sid: 1000041
    sid_aux: 1000042                 # fuzzer user-agent bonus signal
    d3fend: [Network Traffic Analysis, Protocol Metadata Anomaly Detection]
    mitigations: [M1037, M1050]
    observed: "Many HTTP 403/404 replies to GET requests for many DIFFERENT paths (query strings removed), and most of the client's requests fail."
    why: "Wordlist fuzzers request hundreds of guessed paths and almost all miss. Repeated requests for one missing asset, a changing query string on one path, or a broken application with a few missing files do not produce many distinct failing paths or a majority of errors."
    evasion: "Fewer than 25 distinct failing paths or 50 errors in 5 minutes, or padding the scan with successful requests so errors fall below half of all requests (a padded scan is indistinguishable from a broken application: known gap). Spoofing the user agent does not help (no tool signature is required). HTTPS hides paths and status codes from a passive sensor."
    tuning_note: "The first version counted raw 404 replies (15 in 10 s, 25 in 5 min) and false-alerted on 120 requests for ONE missing image, on a changing query string, and on a broken application. The independent HTTP study's distinct-path and error-ratio criteria fix that; layer 1 (rate only) moved to 150 per 10 s, inside its measured safe band."
    design_reference: HTTP_Detection_Report.md
  scan:
    title: Port scanning / service discovery
    technique: T1046
    technique_name: "Network Service Discovery"
    tactic: Discovery
    tactic_id: TA0007
    order: 2
    severity: 4
    l1: {count: 100, window: 5}      # SYNs per source in 5 s (a RATE rule: Suricata cannot count distinct ports)
    l2: {count: 10, window: 300}     # distinct destination ports per source-destination pair in a sliding 5 min
    sid: 1000001
    d3fend: [Connection Attempt Analysis, Network Traffic Analysis]
    mitigations: [M1031, M1037]
    observed: "One source sends TCP connection attempts to many DIFFERENT ports of one target, answered or not (rejected, open or silently dropped)."
    why: "A scanner probes a port range. Legitimate clients talk to a few well-known ports, and repeated attempts to one port (retries, busy web clients) do not raise the distinct-port count."
    evasion: "A slow scan stays under the short window; layer 2 counts distinct ports over a sliding 5 minutes. Fewer than 10 distinct ports (for example a 9-port scan) stays below the threshold (known gap), as does a scan slower than 10 ports per 5 minutes or one spread over many sources."
    tuning_note: "Layer 2 started at 15 and missed a quick 14-port scan and a slow 10-port scan; the sweep put the safe band at 7-10 and we chose 10, matching the independent lab study in Port_Scan_Detection_Report.md. Layer 1 started at 30 and false-alerted on 30 rapid connections to ONE port (retries, a busy script); the safe band became 31-1000 and we chose 100."
    design_reference: Port_Scan_Detection_Report.md
  ssh_bruteforce:
    title: SSH password guessing
    technique: T1110.001
    technique_name: "Password Guessing"
    tactic: Credential Access
    tactic_id: TA0006
    order: 3
    severity: 6
    l1: {count: 20, window: 30}      # new SSH connections per source in 30 s (a RATE rule: loud connection bursts)
    l2: {count: 14, window: 300}     # new SSH connections per source in 5 min (slow connection counting)
    attempts: {count: 8, window: 120}  # Zeek only: INFERRED password attempts in FAILED sessions per source-destination pair, sliding 2 min
    tuning_note: "Layer 2 started at 10 and false-alerted on a monitoring poll (11 SSH checks in 5 min); the sweep chose 14. Layer 1 started at 6 and would false-alert on 12 legitimate rapid logins (the independent SSH study's control); the safe band became 13-31 and we chose 20. The attempt layer (8 inferred attempts in 2 min) comes from that study: hydra reuses connections, so one connection can hold many guesses and counting connections undercounts the attack."
    sid: 1000011
    d3fend: [Connection Attempt Analysis, Network Traffic Analysis]
    mitigations: [M1036, M1031, M1035]
    observed: "Many new connections to port 22 from one source, or many failed authentication attempts inferred by Zeek from the encrypted session (failed sessions only; successful and unknown sessions count zero)."
    why: "Each password guess is an authentication attempt, and tools like hydra reuse one connection for several guesses, so we count both connections and inferred attempts. People rarely fail more than a few times; guessers fail dozens of times. A burst of successful logins is not guessing."
    evasion: "Fewer than 8 inferred attempts in 2 minutes (a 7-attempt run is a documented gap), or throttling below the connection thresholds. Zeek's attempt count is an estimate from packet sizes (12 of 14 in the study; 40 for hydra on our real capture) and is unavailable when SSH compression is negotiated. Guessing spread across many source IPs evades per-source counting (known gap)."
    design_reference: SSH_Detection_Report.md
  smb_admin:
    title: SMB administrative share access
    technique: T1021.002
    technique_name: "SMB/Windows Admin Shares"
    tactic: Lateral Movement
    tactic_id: TA0008
    order: 4
    severity: 8
    sid: 1000031
    sid_aux: 1000032
    d3fend: [Network Traffic Analysis, Protocol Metadata Anomaly Detection]
    mitigations: [M1030, M1035, M1037]
    observed: "An SMB tree-connect to C$, D$ or ADMIN$ from outside the management subnet. IPC$ is excluded (routine). The server's answer (granted, denied, share missing) is recorded."
    why: "Administrative shares expose whole disks. Ordinary file-share traffic uses named shares, never C$ or ADMIN$. A refused request is still an attempt, so we alert on the request, not only on successful mappings."
    evasion: "SMB3 encryption hides the share name from the sensor. Case changes do not evade (matching is case-insensitive). A compromised designated admin host is allowlisted by design and therefore invisible (known gap)."
    allowlist: "meta.mgmt_subnet"       # sources inside the management subnet are expected to use admin shares
    design_reference: SMB_Detection_Report.md

# Fixed answer keys used by the dashboard and reports.
tactic_order: [Reconnaissance, Discovery, "Credential Access", "Lateral Movement"]
